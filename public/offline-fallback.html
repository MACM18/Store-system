<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d4542f">
    <title>You’re offline · Store</title>
    <style>
      *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:#f7f3ed;color:#302923;font-family:Arial,Helvetica,sans-serif}.card{width:min(100%,440px);padding:30px;border:1px solid #e9e0d7;border-radius:18px;background:#fffefa;box-shadow:0 12px 36px #3029230d}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:99px;background:#fff0df;color:#995628;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#cc7842}h1{margin:20px 0 8px;font-size:27px;letter-spacing:-.5px}p{margin:0 0 22px;color:#797166;font-size:14px;line-height:1.65}.button{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:#d4542f;color:#fff;text-decoration:none;font-size:14px;font-weight:700}.note{margin:16px 0 0;font-size:11px}
    </style>
  </head>
  <body><main class="card"><span class="status"><i class="dot"></i> You’re offline</span><h1>Your store counter is ready</h1><p>Open the saved offline counter to continue checkout. Sales will sync when the connection returns.</p><a class="button" href="/offline">Open offline counter</a><p class="note">Offline checkout uses this device’s saved products and today’s open drawer.</p></main></body>
</html>
